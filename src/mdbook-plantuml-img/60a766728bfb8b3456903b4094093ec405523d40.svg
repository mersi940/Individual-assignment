<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="SEQUENCE" height="260px" preserveAspectRatio="none" style="width:827px;height:260px;background:#FFFFFF;" version="1.1" viewBox="0 0 827 260" width="827px" zoomAndPan="magnify"><defs/><g><g><title>WateringTask</title><rect fill="#000000" fill-opacity="0.00000" height="189.0625" width="8" x="56.231" y="36.2969"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;" x1="60" x2="60" y1="36.2969" y2="225.3594"/></g><g><title>GetWaterDuration</title><rect fill="#000000" fill-opacity="0.00000" height="189.0625" width="8" x="457.4785" y="36.2969"/><line style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;" x1="461.46" x2="461.46" y1="36.2969" y2="225.3594"/></g><g class="participant participant-head" data-participant="Water"><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="110.4619" x="5" y="5"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.4619" x="12" y="24.9951">WateringTask</text></g><g class="participant participant-tail" data-participant="Water"><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="110.4619" x="5" y="224.3594"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.4619" x="12" y="244.3545">WateringTask</text></g><g class="participant participant-head" data-participant="Func"><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="142.0371" x="390.46" y="5"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="128.0371" x="397.46" y="24.9951">GetWaterDuration</text></g><g class="participant participant-tail" data-participant="Func"><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="142.0371" x="390.46" y="224.3594"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="128.0371" x="397.46" y="244.3545">GetWaterDuration</text></g><g class="message" data-participant-1="Water" data-participant-2="Func"><polygon fill="#181818" points="449.4785,63.4297,459.4785,67.4297,449.4785,71.4297,453.4785,67.4297" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="60.231" x2="455.4785" y1="67.4297" y2="67.4297"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="377.2476" x="67.231" y="62.3638">GetWaterDuration (MoistIn := Moisture, TempIn := Temp)</text></g><g class="message" data-participant-1="Func" data-participant-2="Water"><polygon fill="#181818" points="71.231,92.5625,61.231,96.5625,71.231,100.5625,67.231,96.5625" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="65.231" x2="460.4785" y1="96.5625" y2="96.5625"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.2871" x="77.231" y="91.4966">Return TIME (WaterDuration)</text></g><path d="M466,109.5625 L466,209.5625 L820,209.5625 L820,119.5625 L810,109.5625 L466,109.5625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M810,109.5625 L810,119.5625 L820,119.5625 L810,109.5625" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.4409" x="472" y="126.6294">1.Start with 10 seconds base time</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.7876" x="472" y="141.7622">2. Add 1 second for every &#176;C above 20 &#176;C</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333.6582" x="472" y="156.895">3. Subtract 0.1 seconds for every 1 % soil moisture</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.104" x="472" y="172.0278">4. Convert the result from seconds to milliseconds</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.8418" x="472" y="187.1606">5. Turn it into a valid TIME value for the timer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.5918" x="472" y="202.2935">6. Limit the time: minimum 5 s, maximum 30 s</text><!--SRC=[NL3BQW8n5DtdAmv2GK47HsiN0oqK-q2ecphGTPo9Ukaa6P8Rs_vLlw5Vran6x6Dtp-EUt9DMEgQAMcaOWnV9of7PbzA_3Y0z4Y7Qtvv7nOcz2quoMPDy3y5KGYGUavi4KU2_5SEr9SyhW-8QQGnEZL4gtVPSDur4sfx4c3wlmBEAHeDojRx7y4_YI1ZB2exs1uRTzNVasORZnNWZFY2VmglAcjfZAxq2arPYbk6shf6V9EoiWpegzu6lpoNarXuLPjCEY7c6JTYoanLZckNdi9-L71VmbXheKoDncM5fJHGPV8ZNAHyQnivPVLvd2qrDGoSi5XdAhYCno4HHuYWRgllESGmglTZ5TGsSkChmH9huJ1Knq90E6WluCRHyJs0U-miLEtOVzGq0]--></g></svg>